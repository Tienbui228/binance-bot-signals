runtime:
  discovery_interval_minutes: 60
  scan_interval_minutes: 5
  outcome_check_interval_minutes: 30
  daily_export_time_utc: "00:00"

discovery:
  peak_window_candles: 200          # 8 ngày × 1h
  pump_pct_min: 0.35
  pump_vol_ratio_min: 3.0
  peak_age_max_hours: 72
  room_pct_min: 0.15
  quote_vol_24h_min_usdt: 500000
  listing_age_min_days: 7
  vol_spike_multiplier: 2.5         # vol > avg * 2.5 = spike
  base_window_candles: 12

scan:
  scan_5m_candles: 288              # 24h
  quote_vol_5m_min_usdt: 10000
  breakdown_body_ratio_min: 0.45
  breakdown_vol_ratio_min: 1.0
  breakdown_taker_sell_ratio_min: 0.52
  false_break_reclaim_bars: 3
  retest_tol: 0.02                  # wick trong 2% của breakdown
  retest_taker_buy_max: 0.45
  signal_max_age_min: 15

scoring:
  min_score_to_alert: 5
  rr_conservative_min: 1.5

watchlist:
  max_symbols: 50
  auto_remove_after_signal: false

alert:
  terminal_enabled: true
  telegram_enabled: false
  telegram_token: ""
  telegram_chat_id: ""

market_cap_filter:
  enabled: true
  max_market_cap_usd: 500000000     # 500M USD — market cap (circulating × price), KHÔNG phải FDV
  cache_hours: 4
  exclude_if_unknown: true          # không map được → exclude (safe side)
  coingecko_base_url: "https://api.coingecko.com/api/v3"
  pages_to_fetch: 3                 # 3 × 250 = 750 coins, đủ bắt top ~200
  request_delay_sec: 1.5            # CoinGecko free tier: ~10 req/min

binance:
  futures_base_url: "https://fapi.binance.com"
  request_timeout_sec: 10
  request_delay_sec: 0.2

# research_config.yaml
# Offline research / measurement config — do NOT merge with live config.yaml
# Version: v1  Updated: 2026-04-06

universe:
  version: "v1"
  period: "5m"
  window_days: 30
  min_quote_volume_usdt_24h: 50_000_000   # 50M USDT 24h volume minimum
  min_data_completeness_pct: 80.0
  quote_asset: "USDT"
  exclude_symbols: []
  max_symbols: 200

research_measurement:
  timeframe: "5m"
  side: "LONG"
  cooldown_minutes: 60
  rule_family: "long_breakout_retest_signature"
  rule_version: "v1"
  measurement_version: "v1"
  adverse_floor: 0.10         # floor denominator for payoff ratio

  # Rolling window constants (Section 9.1.1)
  roll_z_n: 96               # 96 x 5m = 8h lookback for z-score computation
  roll_baseline_n: 288       # 288 x 5m = 24h lookback for volume baseline

  # Compression + breakout structure lookbacks
  compression_recent_bars: 6
  compression_prev_bars: 12   # bars before the recent window (bars t-18 to t-7)
  breakout_level_lookback: 12 # max(high[t-12:t]) = nearby resistance
  atr_proxy_bars: 20

  # --- CANDIDATE RULE V1 THRESHOLDS ---
  # All thresholds are fully configurable here; no hard-codes in code.
  rule_v1:
    compression_score_min: 0.65
    oi_delta_3bar_pct_min: 2.0
    top_vs_global_divergence_min: 0.50    # in z-score units
    taker_imbalance_min: 0.08             # normalised in [-1, +1]
    breakout_quality_band_allowed:
      - "clean"
      - "strong"
    volume_ratio_3bar_min: 1.20
    basis_rate_max_for_long: 0.020        # basis_rate < 2% for healthy long setup

  # --- OUTCOME CLASS THRESHOLDS (Section 12) ---
  outcome_thresholds:
    a_plus_1h_favor_pct: 4.0
    a_plus_1h_adverse_pct_max: 1.5
    a_plus_close_above_1h: true
    a_plus_4h_favor_pct: 8.0             # alternate A+ via 4h
    a_move_1h_favor_pct: 2.5
    a_move_payoff_1h_min: 2.0
    b_move_1h_favor_pct: 1.0
    fail_early_adverse_pct: 2.0           # adverse >= this in first 30m = early fail
    noise_max_1h_favor_pct: 1.0

  # --- BASELINE RULES (Section 17) ---
  baselines:
    - name: "OI_SPIKE_ONLY"
      rule_version: "baseline_v1"
      oi_delta_3bar_pct_min: 3.0
    - name: "BREAKOUT_PLUS_VOLUME_ONLY"
      rule_version: "baseline_v1"
      breakout_quality_band_allowed:
        - "clean"
        - "strong"
      volume_ratio_3bar_min: 1.50

  # --- SIMPLIFIED RESEARCH REGIME (Section Q4) ---
  regime:
    trend_continuation_friendly:
      btc_24h_pct_min: 1.5
      alt_breadth_pct_min: 55.0
    broad_weakness_sell_pressure:
      btc_24h_pct_max: -1.5
      alt_breadth_pct_max: 35.0
    # fallthrough -> unclear_mixed

  # --- BAND BOUNDARIES (for Board D slices) ---
  bands:
    btc_24h:
      strong_bull: 3.0
      mild_bull: 0.0
      mild_bear: -3.0
      # below mild_bear -> strong_bear
    alt_breadth:
      strong: 70.0
      moderate: 50.0
      weak: 30.0
      # below weak -> very_weak
    volatility:                            # 5m close-return std (annualised not needed)
      high_threshold: 0.5                  # std of 5m returns > 0.5% = high vol
      medium_threshold: 0.25              # 0.25–0.5% = medium

cache:
  base_dir: "data/research_cache/binance_proxy"
  rate_limit_sleep_sec: 0.25
  max_retries: 3
  retry_sleep_sec: 2.0

output:
  base_dir: "data/research_outputs"
  emit_feature_slice_csv: true
  emit_regime_slice_csv: true

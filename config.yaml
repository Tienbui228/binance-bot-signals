# Long breakout retest — strategy-specific tuning
# min_post_break_acceptance_ratio: how far into the impulse body the retest
# can dip and still be considered acceptable.
# Default hardcoded = 0.55 (top 45% of impulse range required)
# Patch 1: relaxed to 0.42 to unlock acceptance_floor_lost cases
# that already passed find_retest_long() confirmation.
long_breakout_retest:
  min_post_break_acceptance_ratio: 0.42

# Long accumulation continuation — no-retest breakout-continuation family
long_accumulation_continuation:
  # 1h trend context
  price_ema_fast: 20
  price_ema_slow: 50
  min_closes_above_fast_ma_12: 8
  max_extension_from_ema50_pct: 0.12
  structure_window_bars_1h: 18
  min_structure_quality_score: 4

  # OI participation — MA20 baseline, 1.50x ratio, not below 12h ago
  oi_ma_period: 20
  oi_support_ratio: 1.50

  # Liquidity gate (4h quote volume proxy — separate from 1h participation)
  min_quote_volume_4h_usd: 2000000
  volume_gate_mode: "SOFT_TAG"

  # 1h volume participation (futures quote_volume) — MA20 baseline, 2.00x ratio, not below 12h ago
  vol_participation_ma_period: 20
  vol_participation_ratio: 2.00

  # 5m breakout-continuation trigger
  breakout_lookback_bars_5m: 12
  min_breakout_distance_pct: 0.0015
  min_breakout_body_ratio: 0.45
  min_breakout_vol_ratio: 1.20
  min_close_location: 0.60
  max_upper_wick_ratio: 0.30

  # Stop calculation (applied at confirmation, not at trigger)
  stop_buffer_pct: 0.0015

  # Pending expiry: max bars (5m cadence) before setup is expired
  max_pending_bars_5m: 3
oi_range_breakout:
  # Signal trigger
  oi_spike_min_pct: 5.0           # OI delta % minimum
  vol_ema_period: 20              # EMA period for volume
  vol_ema_multiplier: 2.0         # volume >= X × EMA20
  max_market_cap_usd: 150_000_000 # skip if market cap >= $150M

  # Range detection
  range_lookback_bars_1h: 20      # N bars 1h to detect range
  min_range_width_pct: 0.5        # range too narrow → skip
  max_range_width_pct: 5.0        # range too wide → skip

  # Range detection — ATR filter
  range_atr_period: 14            # ATR lookback
  range_atr_ratio_max: 2.0        # ATR_current / ATR_avg < 2.0 = consolidation

  # Exit
  stop_buffer_pct: 0.2            # buffer below midpoint
  tp1_range_multiplier: 1.0       # TP1 = entry + 1.0× range_height
  tp2_range_multiplier: 1.5       # TP2 = entry + 1.5× range_height
  min_risk_pct: 0.5               # skip if risk too small
  max_risk_pct: 8.0               # skip if risk too large

  # Score gates
  score_min_send: 20
  score_strong_signal: 50
  score_high_conviction: 70

  # Ops
  max_pending_bars_5m: 48         # timeout before confirm (4h = 48×5m)

dispatch:
  dispatch_floor_score: 0           # 0 = no score gate at dispatch (ORB scores 5-45, floor must be 0)

oi_range_breakout:
  # Signal trigger — OI is the ONLY hard gate
  oi_spike_min_pct: 5.0           # OI delta % minimum (1h window: bar[-1] vs bar[-5])
  oi_delta_abs_min_usdt: 400000   # OI abs delta minimum in USDT (Binance+Bybit); 0 = disabled
  vol_ema_period: 20              # logged only, not a gate
  vol_ema_multiplier: 2.0         # hard gate: volume must be ≥ 2× EMA20
  max_market_cap_usd: 500000000    # skip if market cap >= $500M

  # Range detection
  range_lookback_bars_1h: 20
  min_range_width_pct: 0.0
  max_range_width_pct: 60.0       # skip if range too wide (trending)
  range_atr_period: 14
  range_atr_ratio_max: 2.0        # ATR current / ATR avg < 2 — hard reject chaotic/trending
  atr_bonus_threshold: 1.0        # used at dispatch layer for ATR bonus scoring

  # Exit
  stop_buffer_pct: 0.2
  tp1_range_multiplier: 1.0
  tp2_range_multiplier: 1.5
  min_risk_pct: 0.5               # avoid setups too tight (SL vulnerable to noise)
  max_risk_pct: 35.0              # skip if risk > 35%

  # Score gates — disabled
  score_min_send: 0
  score_strong_signal: 50
  score_high_conviction: 70

  # Ops
  max_pending_bars_5m: 48         # timeout before confirm (4h = 48×5m)

long_accumulation_continuation:
  # ── Hard gates (all 8 thresholds) ──────────────────────────────────────────
  pos_trend_min: 0.0         # Gate 1: pos_trend_3v14 must be strictly positive
  pos_now_high: 0.68         # Gate 1: whale loaded threshold (OR-gate with pos_trend)
  pos_now_min: 0.65          # Gate 5: whale position floor — hard minimum
  oi_delta_min_pct: 3        # Gate 2: 1h OI delta floor
  retail_max: 0.70           # Gate 3: retail FOMO cap
  gate:
    min_score: 65            # Gate 4: composite score minimum (0-100 scale)
  # v2.0.1 light gates — shadow mode (activate Day 30 = 2026-06-18)
  gates_v201_enabled: false
  price_vs_baseline_min: -0.02     # Gate 6 (T): 30d price trend floor (-2% tolerance)
  price_trend_7v30_min: -0.02      # Gate 7 (T): 7d momentum floor (-2% tolerance)
  funding_8h_pct_max: 0.03         # Gate 8 (F): crowded-long cap (per-8h Binance %, 0.03 = 0.03%)

  # ── Chart-based S/R levels ──────────────────────────────────────────────────
  stop_buffer_pct: 0.3          # stop = range_low * (1 - 0.3/100)
  range_lookback_bars_1h: 14    # SL anchor: tight accumulation zone low (14h)
  tp_lookback_bars_1h: 48       # TP anchor: swing high / resistance above (48h = 2 days)
  tp2_extension_pct: 1.0        # TP2 = swing_high * (1 + 1.0/100) — just beyond resistance
  min_tp1_distance_pct: 3.0     # TP1 must be ≥ 3% above entry
  min_risk_pct: 0.5             # minimal SL floor (structure-based, not % from entry)
  max_risk_pct: 35.0            # reject if SL > 35% below entry

  # ── Pending expiry ──────────────────────────────────────────────────────────
  max_pending_bars_5m: 3     # expire if not confirmed within 3×5m = 15 min

  # ── Data fetch ──────────────────────────────────────────────────────────────
  history_period: "1d"
  history_limit: 30
  cache_ttl_seconds: 3600

  # ── Score weights (baked into code — audit reference only) ──────────────────
  # gap=30, pos_now=20, pos_trend=20, btc_regime=30 → sum=100
  btc_regime_score_map:
    bull:
      - "trend_continuation_friendly"
    neutral:
      - "unclear_mixed"
    bearish:
      - "broad_weakness_sell_pressure"

  # ── Quality band thresholds ─────────────────────────────────────────────────
  quality_band_strong_min: 70
  quality_band_moderate_min: 40

bybit:
  enabled: true                   # kill switch — false disables all Bybit fetching

# ——— HL Whale Accumulation (standalone hl_scanner.py process) ———
hl_whale_accum:
  enabled: false               # kill switch — false = process exits immediately on start
  hl_gates_enabled: false      # shadow mode; true only after §13 validation + threshold calibration
  fills_poll_interval_sec: 300 # background fills ingestion cadence
  universe:
    mc_source: coingecko
    mc_cap_usd: 500_000_000    # pragmatic cap — NOT a validated edge boundary
    mc_basis: circulating
    mc_unknown_policy: exclude
    refresh_day: monday
    log_excluded: true
  registry_entry:
    single_fill_notional_min: 100_000
    rolling_1h_notional_min: 150_000
    rolling_24h_notional_min: 300_000
    position_value_min: 100_000
  warmup_days: 5               # no signals until this many days after process start
  coverage_min: 0.30           # CALIBRATE in §13 — do not tune until §13 data exists
  top_n: 10
  conc_min: 0.15               # CALIBRATE in §13
  jaccard_min: 0.50            # CALIBRATE in §13
  window_snapshots: 14         # rolling window for trend/delta (snapshot-count based)
  price_vs_baseline_min: -0.02
  price_trend_7v30_min: -0.02
  funding_8h_pct_max: 0.03     # Gate F; unit verified 2026-06-01 (hourly rate × 8 × 100)
  cluster_enabled: true
  registry_stale_days: 5
  scan_interval_tier_a_min: 10
  scan_interval_tier_b_min: 60
  scan_interval_tier_c_min: 360
  http_delay_sec: 0.3
  http_timeout_sec: 10
  data_dir: data/hl_whale_accum

# ——— Universe filter (shared — áp dụng cho tất cả strategies) ———
universe_filter:
  enabled: true
  market_cap_max_usd: 500000000
  cache_hours: 4
  exclude_if_unknown: true
  coingecko_base_url: "https://api.coingecko.com/api/v3"
  pages_to_fetch: 3
  request_delay_sec: 1.5
  cache_path: "data/eligible_universe.json"


# research_top_movers_config.yaml
# Phase R1 Daily Top Movers Research Configuration
#
# This config is research-only.
# It does NOT affect the live bot scanner (oi_scanner.py) or any live config.

research:
  # Default number of top gainers and losers to select per day
  top_n: 10

  # Fixed UTC day boundaries are always used (no rolling 24h)
  # Day window: YYYY-MM-DD 00:00:00 UTC to 23:59:59 UTC
  use_fixed_utc_day: true

  # Pre-day lookback for anchor detection and z-score warmup
  lookback_hours: 8           # 8h = 96 x 5m bars
  lookback_bars_5m: 96

proxy_features:
  # Rolling z-score parameters (per-symbol, per-series)
  zscore_window: 96           # 96 x 5m = 8h
  zscore_min_periods: 48      # min bars before z-score is valid
  zscore_clip: 3.0            # clip to [-3, +3]

  # alignment_bonus = 0.0 in v1 (deferred to v1.1)
  alignment_bonus: 0.0

  # Volume ratio 3-bar: last 3 bars vs prior 6 bars
  volume_ratio_recent_bars: 3
  volume_ratio_base_bars: 6

anchor_detection:
  # Compression window search
  compression_search_window: 18    # search 18 bars before break candidate
  compression_window_size: 6       # 6-bar compression window

  # ATR proxy window
  atr_window: 20                   # median of last 20 x 5m bar ranges

  # P3 lookahead
  p3_lookahead_bars: 12            # 12 x 5m = 60 min

  # P4 timeout
  p4_timeout_minutes: 60           # timeout at P3 + 60 min

  # P1 volume ratio threshold
  p1_volume_ratio_threshold: 1.10

  # P2 break quality required bands for quality detection
  p2_required_quality_bands:
    - clean
    - strong

  # P2 break buffer
  p2_break_buffer_atr_multiple: 0.10   # close > range_high + 0.10 * atr_proxy

image_rendering:
  # Chart dimensions
  figsize_width: 12
  figsize_height: 5
  dpi: 100

  # Number of bars to show around each anchor
  p0_bars_before: 10
  p0_bars_after: 8
  p2_bars_before: 8
  p2_bars_after: 5
  p4_bars_before: 2
  p4_bars_after: 4

output:
  base_dir: "data/research_output/top_movers"
  cache_dir: "data/research_cache/binance_proxy"

  # CSV filenames
  movers_list_csv: "daily_top_movers_list.csv"
  cases_csv: "daily_top_mover_cases.csv"
  anchor_snapshots_csv: "daily_top_mover_anchor_snapshots.csv"
  report_md: "daily_top_mover_research_report.md"

api:
  # Rate limiting: sleep between API calls
  rate_limit_sleep: 0.10

  # Max limit per API call (Binance allows up to 500 for most endpoints)
  klines_limit: 500
  proxy_limit: 500

  # Proxy endpoints only have last 30 days of history
  # Do not attempt to fetch data older than 30 days
  max_history_days: 29
